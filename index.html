<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Kas RT Online</title>
    <!-- Menggunakan Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-6 rounded-xl shadow-md mb-6">
            <h1 class="text-2xl font-bold">Buku Kas RT</h1>
            <p class="text-sm opacity-90">Laporan Transparansi Keuangan Warga</p>
        </header>

        <!-- Ringkasan Saldo (Dashboard Cards) -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-md border-l-4 border-blue-500">
                <p class="text-xs text-gray-500 font-semibold uppercase">Total Saldo Kas</p>
                <p id="total-saldo" class="text-xl font-bold text-gray-800">Rp 0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-md border-l-4 border-green-500">
                <p class="text-xs text-gray-500 font-semibold uppercase">Total Pemasukan</p>
                <p id="total-pemasukan" class="text-xl font-bold text-green-600">Rp 0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-md border-l-4 border-red-500">
                <p class="text-xs text-gray-500 font-semibold uppercase">Total Pengeluaran</p>
                <p id="total-pengeluaran" class="text-xl font-bold text-red-600">Rp 0</p>
            </div>
        </div>

        <!-- Tabel Transaksi -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-4 sm:p-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Daftar Transaksi</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b text-sm text-gray-600">
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Uraian</th>
                            <th class="p-3 text-right">Pemasukan</th>
                            <th class="p-3 text-right">Pengeluaran</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-kas" class="text-sm divide-y">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-gray-500">Memuat data kas...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script Kalkulator & Pembaca CSV -->
    <script>
        // Ganti URL di bawah ini dengan Link CSV dari "Publish to Web" Google Sheets Anda
        const csvUrl = 'MASUKKAN_LINK_CSV_GOOGLE_SHEETS_ANDA_DI_SINI';

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n').map(row => row.split(','));
                const tbody = document.getElementById('tabel-kas');
                tbody.innerHTML = '';

                let sumMasukan = 0;
                let sumPengeluaran = 0;

                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (cols.length >= 4 && cols[0].trim() !== "") {
                        const tgl = cols[0].replace(/"/g, '').trim();
                        const uraian = cols[1].replace(/"/g, '').trim();
                        
                        // Bersihkan format angka dari simbol titik/koma jika ada
                        const masukVal = parseFloat(cols[2] ? cols[2].replace(/"/g, '').replace(/[^0-9.-]+/g, "") : 0) || 0;
                        const keluarVal = parseFloat(cols[3] ? cols[3].replace(/"/g, '').replace(/[^0-9.-]+/g, "") : 0) || 0;

                        sumMasukan += masukVal;
                        sumPengeluaran += keluarVal;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="p-3">${tgl}</td>
                            <td class="p-3">${uraian}</td>
                            <td class="p-3 text-right text-green-600 font-medium">${masukVal > 0 ? 'Rp ' + masukVal.toLocaleString('id-ID') : '-'}</td>
                            <td class="p-3 text-right text-red-600 font-medium">${keluarVal > 0 ? 'Rp ' + kelurVal ? 'Rp ' + keluarVal.toLocaleString('id-ID') : '-' : '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                }

                let totalSaldoAkhir = sumMasukan - sumPengeluaran;

                // Tampilkan hasil kalkulasi ke kotak ringkasan atas
                document.getElementById('total-pemasukan').innerText = 'Rp ' + sumMasukan.toLocaleString('id-ID');
                document.getElementById('total-pengeluaran').innerText = 'Rp ' + sumPengeluaran.toLocaleString('id-ID');
                document.getElementById('total-saldo').innerText = 'Rp ' + totalSaldoAkhir.toLocaleString('id-ID');
            })
            .catch(error => {
                console.error('Gagal memuat data:', error);
                document.getElementById('tabel-kas').innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Gagal memuat data kas. Periksa kembali link CSV Anda.</td></tr>`;
            });
    </script>
</body>
</html>
