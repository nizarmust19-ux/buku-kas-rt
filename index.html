<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan RT 01 RW 03</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-12">

    <!-- Header Navbar -->
    <header class="bg-blue-700 text-white shadow-md">
        <div class="max-w-xl mx-auto p-4 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">RT 01 / RW 03</h1>
                <p class="text-xs text-blue-200">Sistem Transparansi Keuangan Warga</p>
            </div>
            <button onclick="bukaAdmin()" class="bg-blue-600 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg border border-blue-500 transition font-medium">
                🔑 Login Pengurus
            </button>
        </div>
    </header>

    <!-- Navigasi Tab Menu -->
    <div class="max-w-xl mx-auto px-4 mt-4">
        <div class="flex bg-white rounded-xl shadow-sm p-1">
            <button onclick="gantiTab('laporan')" id="tab-laporan" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition">Laporan Keuangan</button>
            <button onclick="gantiTab('pengurus')" id="tab-pengurus" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 transition">Data Pengurus</button>
        </div>
    </div>

    <!-- Konten Utama -->
    <main class="max-w-xl mx-auto p-4 space-y-4">

        <!-- TAB LAPORAN KEUANGAN -->
        <section id="section-laporan" class="space-y-4">
            <!-- Kartu Ringkasan Saldo Keseluruhan -->
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-white p-3 rounded-xl shadow-sm border-t-4 border-blue-600">
                    <p class="text-[10px] text-slate-400 uppercase font-bold">Saldo Akhir</p>
                    <p id="txt-saldo" class="text-sm sm:text-base font-extrabold text-slate-800">Rp 0</p>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border-t-4 border-emerald-500">
                    <p class="text-[10px] text-slate-400 uppercase font-bold">Pemasukan</p>
                    <p id="txt-masuk" class="text-sm sm:text-base font-extrabold text-emerald-600">Rp 0</p>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border-t-4 border-rose-500">
                    <p class="text-[10px] text-slate-400 uppercase font-bold">Pengeluaran</p>
                    <p id="txt-keluar" class="text-sm sm:text-base font-extrabold text-rose-600">Rp 0</p>
                </div>
            </div>

            <!-- Tabel Transaksi (10 Terakhir) -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden p-4">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-slate-700">10 Transaksi Terakhir</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 border-b">
                                <th class="p-2">Tanggal</th>
                                <th class="p-2">Uraian</th>
                                <th class="p-2 text-right">Masuk</th>
                                <th class="p-2 text-right">Keluar</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-transaksi" class="divide-y">
                            <tr><td colspan="4" class="p-4 text-center text-slate-400">Memuat data kas...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB DATA PENGURUS -->
        <section id="section-pengurus" class="space-y-3 hidden">
            <div class="bg-white rounded-xl shadow-sm p-4">
                <h2 class="text-sm font-bold text-slate-700 mb-3">Daftar Pengurus RT 01 RW 03</h2>
                <div id="list-pengurus" class="space-y-2">
                    <p class="text-xs text-slate-400 text-center py-4">Memuat data pengurus...</p>
                </div>
            </div>
        </section>

        <!-- FORM INPUT ADMIN (Tersembunyi Awalnya) -->
        <section id="section-admin" class="bg-white rounded-xl shadow-sm p-4 hidden border-2 border-blue-200">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-blue-700">✍️ Tambah Kas Baru (Admin)</h2>
                <button onclick="tutupAdmin()" class="text-xs text-rose-500 font-bold hover:underline">Tutup</button>
            </div>
            <form id="form-kas" onsubmit="kirimDataKas(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Tanggal</label>
                    <input type="date" id="input-tgl" required class="w-full p-2 border rounded-lg bg-slate-50">
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Uraian / Keterangan</label>
                    <input type="text" id="input-uraian" placeholder="Contoh: Iuran Warga Bulanan" required class="w-full p-2 border rounded-lg bg-slate-50">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Pemasukan (Rp)</label>
                        <input type="number" id="input-masuk" placeholder="0" class="w-full p-2 border rounded-lg bg-slate-50">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Pengeluaran (Rp)</label>
                        <input type="number" id="input-keluar" placeholder="0" class="w-full p-2 border rounded-lg bg-slate-50">
                    </div>
                </div>
                <button type="submit" id="btn-simpan" class="w-full bg-blue-600 text-white font-bold p-2.5 rounded-lg hover:bg-blue-700 transition">Simpan Transaksi</button>
            </form>
        </section>

    </main>

    <!-- Pemanggilan File Modular -->
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
