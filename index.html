<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Warga RT 01 / RW 03</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf CDN untuk unduh PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased pb-20">

    <!-- Header / Navigasi Atas -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="font-bold text-base sm:text-lg">RT 01 / RW 03</h1>
                <p class="text-xs text-blue-100">Portal Keuangan & Warga</p>
            </div>
            <button onclick="bukaModalAdmin()" class="bg-blue-700 hover:bg-blue-800 p-2 rounded-xl text-xs font-semibold transition border border-blue-500">
                + Input Kas
            </button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- TAB LAPORAN KAS -->
        <section id="section-laporan" class="space-y-4">
            <!-- Kartu Ringkasan Saldo -->
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-5 rounded-2xl shadow-sm space-y-3">
                <p class="text-xs text-blue-100 font-medium">Saldo Kas Terkini</p>
                <h2 id="txt-saldo" class="text-2xl sm:text-3xl font-bold">Rp 0</h2>
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-blue-500/40 text-xs">
                    <div>
                        <span class="text-blue-200 block">Total Masuk</span>
                        <span id="txt-masuk" class="font-semibold text-emerald-300">Rp 0</span>
                    </div>
                    <div>
                        <span class="text-blue-200 block">Total Keluar</span>
                        <span id="txt-keluar" class="font-semibold text-rose-300">Rp 0</span>
                    </div>
                </div>
            </div>

            <!-- Area Laporan Kas (Untuk PDF & Filter) -->
            <div id="area-laporan-kas" class="bg-white p-4 rounded-2xl shadow-sm space-y-4">
                
                <div class="flex justify-between items-center pb-2 border-b">
                    <h3 class="font-bold text-slate-800 text-sm sm:text-base">Riwayat Transaksi</h3>
                    <div class="flex gap-1.5">
                        <button onclick="bagikanKeWA()" title="Bagikan ke WhatsApp" class="bg-emerald-500 hover:bg-emerald-600 text-white p-2 rounded-xl text-xs font-semibold transition flex items-center gap-1">
                            💬 Share WA
                        </button>
                        <button onclick="unduhPDF()" title="Unduh PDF" class="bg-slate-800 hover:bg-slate-900 text-white p-2 rounded-xl text-xs font-semibold transition flex items-center gap-1">
                            📄 PDF
                        </button>
                    </div>
                </div>

                <!-- Filter Model Dompet Digital -->
                <div class="grid grid-cols-2 gap-2">
                    <select id="filter-rentang" class="p-2.5 border rounded-xl text-xs bg-slate-50 font-medium" onchange="filterDataLaporan()">
                        <option value="30">30 Hari Terakhir</option>
                        <option value="semua_waktu">Semua Waktu</option>
                    </select>

                    <select id="filter-bulan" class="p-2.5 border rounded-xl text-xs bg-slate-50 font-medium" onchange="filterDataLaporan()">
                        <option value="semua">Semua Periode Bulan</option>
                    </select>
                </div>

                <!-- Daftar Transaksi -->
                <div id="list-transaksi" class="divide-y divide-slate-100">
                    <p class="text-xs sm:text-sm text-slate-400 text-center py-6">Memuat data transaksi...</p>
                </div>
            </div>
        </section>

        <!-- TAB PENGURUS -->
        <section id="section-pengurus" class="space-y-3 hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
                <h3 class="font-bold text-slate-800 text-sm sm:text-base">Daftar Pengurus RT</h3>
                <div id="list-pengurus" class="space-y-2">
                    <p class="text-xs sm:text-sm text-slate-400 text-center py-6">Memuat pengurus...</p>
                </div>
            </div>
        </section>

        <!-- TAB POJOK WARGA / SARAN -->
        <section id="section-saran" class="space-y-3 hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
                <h3 class="font-bold text-slate-800 text-sm sm:text-base">Pojok Warga & Saran</h3>
                <form id="form-saran" onsubmit="kirimSaran(event)" class="space-y-3 text-xs sm:text-sm">
                    <input type="text" id="saran-nama" placeholder="Nama / No Rumah" required class="w-full p-2.5 border rounded-xl">
                    <textarea id="saran-pesan" placeholder="Tulis masukan atau pesan untuk RT..." rows="3" required class="w-full p-2.5 border rounded-xl"></textarea>
                    <button type="submit" id="btn-saran" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl font-semibold transition">Kirim Pesan 🚀</button>
                </form>
                <div class="border-t pt-3 space-y-2" id="list-saran">
                    <p class="text-xs text-slate-400 text-center py-2">Memuat pesan...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-2 z-40 max-w-md mx-auto">
        <div class="grid grid-cols-3 gap-1">
            <button onclick="gantiTab('laporan')" id="tab-laporan" class="flex flex-col items-center justify-center py-2.5 rounded-xl bg-blue-600 text-white transition shadow-sm space-y-1 text-xs font-semibold">
                <span>📊</span> Laporan Kas
            </button>
            <button onclick="gantiTab('pengurus')" id="tab-pengurus" class="flex flex-col items-center justify-center py-2.5 rounded-xl text-slate-600 hover:bg-slate-50 transition space-y-1 text-xs font-semibold">
                <span>👥</span> Pengurus
            </button>
            <button onclick="gantiTab('saran')" id="tab-saran" class="flex flex-col items-center justify-center py-2.5 rounded-xl text-slate-600 hover:bg-slate-50 transition space-y-1 text-xs font-semibold">
                <span>💬</span> Pojok Warga
            </button>
        </div>
    </nav>

    <!-- Modal Input Kas Sederhana -->
    <div id="modal-admin" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm p-5 rounded-2xl shadow-lg space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm sm:text-base">Tambah Transaksi Kas</h3>
                <button onclick="tutupModalAdmin()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>
            <form id="form-kas" onsubmit="kirimDataKas(event)" class="space-y-3 text-xs sm:text-sm">
                <div>
                    <label class="block text-slate-500 mb-1">Tanggal</label>
                    <input type="date" id="input-tgl" required class="w-full p-2.5 border rounded-xl">
                </div>
                <div>
                    <label class="block text-slate-500 mb-1">Uraian / Keterangan</label>
                    <input type="text" id="input-uraian" placeholder="Contoh: Iuran Warga Bulanan" required class="w-full p-2.5 border rounded-xl">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-500 mb-1">Pemasukan (Rp)</label>
                        <input type="number" id="input-masuk" placeholder="0" class="w-full p-2.5 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1">Pengeluaran (Rp)</label>
                        <input type="number" id="input-keluar" placeholder="0" class="w-full p-2.5 border rounded-xl">
                    </div>
                </div>
                <button type="submit" id="btn-simpan" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl font-semibold transition mt-2">Simpan Transaksi</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
    </html>
